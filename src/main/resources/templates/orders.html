<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Sales Orders - POC</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">
    <div class="d-flex justify-content-between align-items-center">
        <h1>Sales Orders</h1>
        <a href="/" class="btn btn-secondary">Back to Home</a>
    </div>
    <hr>
    <table class="table table-striped">
        <thead>
            <tr>
                <th>Order Number</th>
                <th>Partner</th>
                <th>Date</th>
                <th>Total</th>
                <th>Status</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="order : ${orders}">
                <td th:text="${order.salesOrderNumber}">SO-001</td>
                <td th:text="${order.partnerName}">Partner Name</td>
                <td th:text="${order.orderDate}">2026-01-01</td>
                <td th:text="${order.totalAmount}">100.00</td>
                <td>
                    <span th:text="${order.status}" class="badge bg-primary">DRAFT</span>
                </td>
            </tr>
        </tbody>
    </table>
</body>
</html>
