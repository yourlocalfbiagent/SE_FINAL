<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ERP System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --font: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      --color-primary: #f59e0b;
      --color-primary-hover: #d97706;
      --sidebar-bg: #1e293b;
      --sidebar-w: 250px;
      --topbar-h: 60px;
      --content-bg: #f8fafc;
      --card-bg: #ffffff;
      --border: #e2e8f0;
      --text: #0f172a;
      --text-sec: #475569;
      --text-muted: #94a3b8;
      --success: #10b981;
      --danger: #ef4444;
      --radius: 10px;
      --radius-sm: 8px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body { font-family: var(--font); color: var(--text); background: var(--content-bg); -webkit-font-smoothing: antialiased; }
    a { color: var(--color-primary); text-decoration: none; }

    /* ===== APP SHELL ===== */
    .app-shell { display: flex; min-height: 100vh; }
    .app-main { flex: 1; margin-left: var(--sidebar-w); display: flex; flex-direction: column; min-height: 100vh; }
    .app-content { flex: 1; padding: 28px 32px; }

    /* ===== SIDEBAR ===== */
    .sidebar {
      width: var(--sidebar-w); background: var(--sidebar-bg); position: fixed; left: 0; top: 0;
      height: 100vh; display: flex; flex-direction: column; z-index: 100; overflow-y: auto;
    }
    .sidebar__brand {
      display: flex; align-items: center; gap: 10px; padding: 20px 20px 12px; border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    .sidebar__brand-text { color: #fff; font-size: 17px; font-weight: 700; letter-spacing: -0.3px; }
    .sidebar__nav { flex: 1; padding: 8px 10px; overflow-y: auto; }
    .sidebar__section { margin-bottom: 4px; }
    .sidebar__sec-label {
      font-size: 10px; font-weight: 600; color: #64748b; text-transform: uppercase;
      letter-spacing: 0.06em; padding: 14px 10px 5px;
    }
    .sidebar__item {
      display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px;
      color: #94a3b8; font-size: 13.5px; font-weight: 500; cursor: pointer;
      border: none; background: none; width: 100%; text-align: left; font-family: var(--font);
      transition: all 0.15s;
    }
    .sidebar__item:hover { background: rgba(255,255,255,0.06); color: #e2e8f0; }
    .sidebar__item--active { background: rgba(245,158,11,0.12); color: #f59e0b; }
    .sidebar__footer {
      padding: 12px 14px; border-top: 1px solid rgba(255,255,255,0.06);
      display: flex; align-items: center; gap: 10px;
    }
    .sidebar__user { display: flex; align-items: center; gap: 10px; flex: 1; }
    .sidebar__user-info { display: flex; flex-direction: column; }
    .sidebar__user-name { color: #e2e8f0; font-size: 13px; font-weight: 600; }
    .sidebar__user-role { color: #64748b; font-size: 11px; }
    .sidebar__logout {
      background: none; border: none; color: #64748b; cursor: pointer; padding: 6px;
      border-radius: 6px; transition: all 0.15s;
    }
    .sidebar__logout:hover { color: #ef4444; background: rgba(239,68,68,0.1); }

    /* ===== TOPBAR ===== */
    .topbar {
      height: var(--topbar-h); background: var(--card-bg); border-bottom: 1px solid var(--border);
      display: flex; align-items: center; padding: 0 28px; gap: 12px; flex-shrink: 0;
    }
    .topbar__crumb { font-size: 13px; color: var(--text-muted); font-weight: 500; }
    .topbar__spacer { flex: 1; }
    .topbar__search { display: flex; align-items: center; gap: 6px; }
    .topbar__search-btn {
      background: none; border: none; color: var(--text-muted); cursor: pointer; padding: 6px;
      border-radius: 6px; display: flex; align-items: center;
    }
    .topbar__search-btn:hover { background: var(--content-bg); color: var(--text); }
    .topbar__search-input {
      width: 200px; height: 34px; padding: 0 10px; border: 1px solid var(--border); border-radius: 6px;
      font-family: var(--font); font-size: 13px; outline: none; background: var(--content-bg);
    }
    .topbar__search-input:focus { border-color: var(--color-primary); }
    .topbar__icon-btn {
      background: none; border: none; color: var(--text-muted); cursor: pointer;
      padding: 6px; border-radius: 6px; position: relative; display: flex; align-items: center;
    }
    .topbar__icon-btn:hover { background: var(--content-bg); }
    .topbar__notif-dot {
      position: absolute; top: 4px; right: 4px; width: 7px; height: 7px;
      background: #ef4444; border-radius: 50%; border: 1.5px solid var(--card-bg);
    }

    /* ===== PAGE HEADER ===== */
    .page-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
    .page-header__title { font-size: 22px; font-weight: 700; color: var(--text); }
    .page-header__sub { font-size: 13px; color: var(--text-muted); margin-top: 2px; }
    .page-header__actions { display: flex; gap: 10px; align-items: center; }

    /* ===== PAGE SPLIT (table + detail) ===== */
    .page-split { display: flex; gap: 20px; }
    .page-split__main { flex: 1; min-width: 0; }

    /* ===== DATA TABLE ===== */
    .dt-wrap { background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
    .dt-scroll { overflow-x: auto; }
    .dt { width: 100%; border-collapse: collapse; font-size: 13.5px; }
    .dt thead { background: #f8fafc; }
    .dt th {
      padding: 10px 14px; text-align: left; font-weight: 600; color: var(--text-sec);
      font-size: 12px; text-transform: uppercase; letter-spacing: 0.03em;
      border-bottom: 1px solid var(--border); cursor: pointer; user-select: none; white-space: nowrap;
    }
    .dt td { padding: 10px 14px; border-bottom: 1px solid #f1f5f9; vertical-align: middle; }
    .dt tbody tr { transition: background 0.1s; cursor: pointer; }
    .dt tbody tr:hover { background: #f8fafc; }
    .dt-row--sel { background: #fffbeb !important; }
    .dt-row--danger { background: #fef2f2 !important; }
    .dt-chk { width: 40px; text-align: center; }
    .dt-chk input { accent-color: var(--color-primary); }
    .dt-num { font-variant-numeric: tabular-nums; }
    .dt-sort-arrow { margin-left: 4px; font-size: 11px; }
    .dt-th { position: relative; }
    .dt-pag {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 14px; border-top: 1px solid var(--border); font-size: 12px; color: var(--text-muted);
    }
    .dt-pag__btns { display: flex; gap: 6px; }
    .dt-pag__btn {
      padding: 5px 12px; border: 1px solid var(--border); border-radius: 6px; background: var(--card-bg);
      font-family: var(--font); font-size: 12px; cursor: pointer; color: var(--text-sec);
    }
    .dt-pag__btn:hover:not(:disabled) { background: var(--content-bg); }
    .dt-pag__btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .mono { font-variant-numeric: tabular-nums; font-weight: 500; }
    .mini-dt { font-size: 13px; }
    .mini-dt th { font-size: 11px; padding: 8px 10px; }
    .mini-dt td { padding: 8px 10px; }

    /* ===== AVATARS ===== */
    .avatar-xs {
      width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center;
      justify-content: center; font-size: 11px; font-weight: 700; color: #fff; flex-shrink: 0;
    }
    .avatar-lg {
      width: 56px; height: 56px; border-radius: 50%; display: flex; align-items: center;
      justify-content: center; font-size: 20px; font-weight: 700; color: #fff;
    }
    .avatar-cell { display: flex; align-items: center; gap: 10px; }

    /* ===== BADGE ===== */
    .badge {
      display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 11px;
      font-weight: 600; white-space: nowrap; letter-spacing: 0.02em;
    }

    /* ===== BUTTONS ===== */
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      height: 38px; padding: 0 18px; border: none; border-radius: var(--radius-sm);
      font-size: 13.5px; font-weight: 600; font-family: var(--font); cursor: pointer;
      transition: all 0.15s; white-space: nowrap;
    }
    .btn:active { transform: scale(0.97); }
    .btn--primary { background: var(--color-primary); color: #fff; }
    .btn--primary:hover { background: var(--color-primary-hover); box-shadow: 0 2px 8px rgba(245,158,11,0.3); }
    .btn--secondary { background: var(--sidebar-bg); color: #fff; }
    .btn--secondary:hover { background: #334155; }
    .btn--ghost { background: none; color: var(--text-sec); border: 1px solid var(--border); }
    .btn--ghost:hover { background: var(--content-bg); }
    .btn--success { background: var(--success); color: #fff; }
    .btn--success:hover { background: #059669; }
    .btn--danger { background: var(--danger); color: #fff; }
    .btn--danger:hover { background: #dc2626; }
    .btn--sm { height: 32px; padding: 0 12px; font-size: 12px; }

    /* ===== DETAIL PANEL ===== */
    .dp {
      width: 340px; flex-shrink: 0; background: var(--card-bg); border: 1px solid var(--border);
      border-radius: var(--radius); display: flex; flex-direction: column; animation: slideIn 0.2s ease;
      max-height: calc(100vh - var(--topbar-h) - 80px); overflow: hidden;
    }
    .dp__head {
      display: flex; align-items: center; justify-content: space-between;
      padding: 16px 18px; border-bottom: 1px solid var(--border);
    }
    .dp__title { font-size: 15px; font-weight: 700; }
    .dp__close {
      background: none; border: none; font-size: 16px; color: var(--text-muted); cursor: pointer;
      width: 28px; height: 28px; border-radius: 6px; display: flex; align-items: center; justify-content: center;
    }
    .dp__close:hover { background: var(--content-bg); color: var(--text); }
    .dp__body { padding: 16px 18px; overflow-y: auto; flex: 1; }
    .dp__foot { padding: 14px 18px; border-top: 1px solid var(--border); }
    .dp__actions { display: flex; gap: 8px; justify-content: flex-end; }
    .dp__divider { border: none; border-top: 1px solid var(--border); margin: 12px 0; }
    .dp__section-title { font-size: 13px; font-weight: 600; color: var(--text-sec); margin-bottom: 8px; }
    .dp__alert {
      margin-top: 12px; padding: 10px; background: #fef2f2; color: #ef4444;
      border-radius: 6px; font-size: 12px; font-weight: 500;
    }
    .dp-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; font-size: 13px; }
    .dp-row__label { color: var(--text-muted); }
    .dp-row__value { font-weight: 500; color: var(--text); text-align: right; }
    .dp-row__value--bold { font-size: 16px; font-weight: 700; color: var(--color-primary); }

    /* ===== MODAL ===== */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(15,23,42,0.45); z-index: 200;
      display: flex; align-items: center; justify-content: center; animation: fadeIn 0.15s;
    }
    .modal-box {
      background: var(--card-bg); border-radius: var(--radius); box-shadow: 0 20px 50px rgba(0,0,0,0.15);
      width: 90%; animation: slideUp 0.2s ease;
    }
    .modal-head {
      display: flex; align-items: center; justify-content: space-between;
      padding: 18px 22px; border-bottom: 1px solid var(--border);
    }
    .modal-head h3 { font-size: 16px; font-weight: 700; }
    .modal-x {
      background: none; border: none; font-size: 18px; color: var(--text-muted); cursor: pointer;
      width: 30px; height: 30px; border-radius: 6px; display: flex; align-items: center; justify-content: center;
    }
    .modal-x:hover { background: var(--content-bg); }
    .modal-body { padding: 20px 22px; display: flex; flex-direction: column; gap: 14px; }
    .modal-foot {
      padding: 14px 22px; border-top: 1px solid var(--border);
      display: flex; gap: 8px; justify-content: flex-end;
    }

    /* ===== KPI CARDS ===== */
    .kpi-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 24px; }
    .kpi {
      background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 18px 20px;
    }
    .kpi__label { font-size: 12px; color: var(--text-muted); font-weight: 500; margin-bottom: 6px; }
    .kpi__value { font-size: 26px; font-weight: 700; color: var(--text); letter-spacing: -0.5px; }
    .kpi__trend { font-size: 12px; font-weight: 600; margin-top: 4px; display: inline-block; }
    .kpi__trend--up { color: var(--success); }
    .kpi__trend--down { color: var(--danger); }

    /* ===== DASHBOARD ===== */
    .dash-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; }
    .dash-card {
      background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius);
      overflow: hidden;
    }
    .dash-card--wide { grid-column: span 1; }
    .dash-card__head {
      display: flex; align-items: center; justify-content: space-between;
      padding: 16px 20px; border-bottom: 1px solid var(--border);
    }
    .dash-card__head h3 { font-size: 15px; font-weight: 700; }
    .dash-card__sub { font-size: 12px; color: var(--text-muted); }

    /* ===== BAR CHART ===== */
    .barchart { padding: 20px; display: flex; flex-direction: column; justify-content: flex-end; }
    .barchart__bars { display: flex; align-items: flex-end; gap: 6px; height: 100%; }
    .barchart__col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; height: 100%; justify-content: flex-end; }
    .barchart__bar {
      width: 100%; border-radius: 4px 4px 0 0; background: var(--color-primary);
      min-height: 4px; transition: height 0.4s ease; opacity: 0.85;
    }
    .barchart__col:hover .barchart__bar { opacity: 1; }
    .barchart__lbl { font-size: 10px; color: var(--text-muted); font-weight: 500; }

    /* ===== ACTIVITY LIST ===== */
    .activity-list { padding: 8px 16px; }
    .activity-item { display: flex; gap: 10px; padding: 10px 0; border-bottom: 1px solid #f1f5f9; }
    .activity-item:last-child { border-bottom: none; }
    .activity-item__text { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
    .activity-item__action { font-size: 13px; color: var(--text); font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .activity-item__time { font-size: 11px; color: var(--text-muted); }

    /* ===== FILTER BAR ===== */
    .filter-bar { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; align-items: center; }
    .filter-sel {
      height: 36px; padding: 0 12px; border: 1px solid var(--border); border-radius: 6px;
      font-family: var(--font); font-size: 13px; background: var(--card-bg); color: var(--text-sec);
      cursor: pointer; outline: none;
    }
    .filter-sel:focus { border-color: var(--color-primary); }
    .filter-search {
      display: flex; align-items: center; gap: 6px; margin-left: auto;
      border: 1px solid var(--border); border-radius: 6px; padding: 0 10px; background: var(--card-bg);
    }
    .filter-search svg { color: var(--text-muted); flex-shrink: 0; }
    .filter-search__input {
      height: 34px; border: none; outline: none; font-family: var(--font); font-size: 13px;
      width: 180px; background: transparent;
    }

    /* ===== FORM FIELDS ===== */
    .ff { display: flex; flex-direction: column; gap: 5px; }
    .ff__label { font-size: 13px; font-weight: 500; color: #334155; }
    .ff__req { color: var(--danger); margin-left: 2px; }
    .ff__input {
      height: 40px; padding: 0 12px; border: 1px solid var(--border); border-radius: 8px;
      font-family: var(--font); font-size: 13.5px; color: var(--text); background: #f8fafc;
      outline: none; transition: border-color 0.2s;
    }
    .ff__input:focus { border-color: var(--color-primary); background: #fff; }
    .ff__input--err { border-color: var(--danger); }
    .ff__err { font-size: 12px; color: var(--danger); }
    .ff-row { display: flex; gap: 12px; }
    .ff-row > .ff { flex: 1; }

    /* ===== RADIO GROUP ===== */
    .radio-group { display: flex; gap: 8px; margin-top: 4px; }
    .radio-opt {
      display: flex; align-items: center; gap: 6px; padding: 8px 16px;
      border: 1px solid var(--border); border-radius: 8px; cursor: pointer;
      font-size: 13px; font-weight: 500; transition: all 0.15s;
    }
    .radio-opt--active { border-color: var(--color-primary); background: #fffbeb; color: var(--color-primary); }
    .radio-opt input { accent-color: var(--color-primary); }

    /* ===== CONFIG PAGE ===== */
    .config-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 20px; }
    .config-card {
      background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 22px; display: flex; flex-direction: column; gap: 14px;
    }
    .config-card__title { font-size: 15px; font-weight: 700; color: var(--text); padding-bottom: 8px; border-bottom: 1px solid var(--border); }

    /* ===== PERMISSIONS LIST ===== */
    .perm-list { display: flex; flex-direction: column; gap: 4px; max-height: 260px; overflow-y: auto; }
    .perm-item { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text); cursor: default; padding: 3px 0; }
    .perm-item input { accent-color: var(--color-primary); }
    .perm-item--off { color: var(--text-muted); }

    /* ===== ERROR PAGE ===== */
    .error-page {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      text-align: center; padding: 80px 20px;
    }
    .error-page__code { font-size: 72px; font-weight: 800; color: var(--color-primary); letter-spacing: -2px; }
    .error-page__title { font-size: 24px; font-weight: 700; margin-top: 8px; }
    .error-page__msg { font-size: 15px; color: var(--text-muted); margin: 12px 0 24px; max-width: 400px; }

    /* ===== EMPTY STATE ===== */
    .empty-state {
      text-align: center; padding: 48px 20px; color: var(--text-muted); font-size: 14px;
      background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius);
    }

    /* ===== ANIMATIONS ===== */
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes slideUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes slideIn { from { opacity: 0; transform: translateX(12px); } to { opacity: 1; transform: translateX(0); } }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 1024px) {
      .kpi-grid { grid-template-columns: repeat(2, 1fr); }
      .dash-grid { grid-template-columns: 1fr; }
      .page-split { flex-direction: column; }
      .dp { width: 100%; max-height: none; }
    }
    @media (max-width: 768px) {
      .sidebar { display: none; }
      .app-main { margin-left: 0; }
      .kpi-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>

  <script type="text/babel" src="erp-api.jsx"></script>
  <script type="text/babel" src="erp-shared.jsx"></script>
  <script type="text/babel" src="erp-layout.jsx"></script>
  <script type="text/babel" src="erp-dashboard.jsx"></script>
  <script type="text/babel" src="erp-sales.jsx"></script>
  <script type="text/babel" src="erp-purchase.jsx"></script>
  <script type="text/babel" src="erp-inventory.jsx"></script>
  <script type="text/babel" src="erp-admin.jsx"></script>
  <script type="text/babel" src="erp-reports-audit.jsx"></script>
  <script type="text/babel" src="erp-app.jsx"></script>
</body>
